name: Soft Tech Provider Core v1 release
on:
  push:
    branches: [feat/provider-core-independent-20261109]
    paths: ['.github/workflows/provider-core-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checked-in core syntax, persistence, security and transaction tests
        working-directory: provider-dashboard
        run: |
          npm run check
          npm test
      - name: Install browser QA
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Actual HTTP desktop and mobile dashboard QA
        working-directory: provider-dashboard
        run: python test/browser.py
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: softtech-provider-core-qa
          path: provider-dashboard/qa-artifacts/provider-core/
          if-no-files-found: warn
          retention-days: 7
