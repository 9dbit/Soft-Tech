name: V5 Desktop Prototype QA
permissions:
  contents: read
  issues: write
  pull-requests: write
on:
  push:
    branches:
      - "fix/soft-tech-v6-1-universal-restore-20261102"
      - "feat/v61-minecraft-mono-uilock-20261102"
  pull_request:
    branches: [main]
    paths:
      - 'src/components/v5-desktop-hero.tsx'
      - 'src/components/v52-mobile-hero.tsx'
      - 'src/app/v52-mobile.css'
      - 'src/app/v57-unified-ui.css'
      - 'src/components/portal.tsx'
      - 'src/app/v5-desktop.css'
      - 'src/app/layout.tsx'
      - 'scripts/v5-visual-qa.mjs'
      - 'package.json'
      - '.github/workflows/v5-desktop-qa.yml'
  workflow_dispatch:

jobs:
  build:
    name: Next.js build & TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify locked V6.1 UI and orange-computer assets
        run: node scripts/verify-ui-lock.mjs
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  visual:
    name: V5.2 Desktop & Mobile Browser QA
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify locked V6.1 UI and orange-computer assets
        run: node scripts/verify-ui-lock.mjs
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        run: npm run build
      - name: Install screenshot browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          nohup npm run start -- -p 3000 > /tmp/soft-tech-v5-next.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/soft-tech-v5-next.log
          exit 1
      - name: Capture real-browser screenshots and QA
        run: node scripts/v5-visual-qa.mjs
      - name: Upload visual QA screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-tech-v5-2-cross-device-qa
          path: qa-artifacts/v5/
          if-no-files-found: warn
          retention-days: 14

      - name: Post browser QA summary to pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- soft-tech-v5-visual-qa -->';
            let report;
            try {
              report = JSON.parse(fs.readFileSync('qa-artifacts/v5/report.json', 'utf8'));
            } catch (error) {
              report = { errors: ['QA report missing: ' + error.message], checks: [] };
            }
            const rows = report.checks.map(c =>
              '- ' + c.viewport.name + ': viewport ' + c.windowWidth + 'px, scrollWidth ' + c.scrollWidth +
              'px, artwork ' + (c.artReady ? 'loaded' : 'not ready') +
              ', stage ' + (c.stage ? c.stage.x + ',' + c.stage.y : 'not mounted')
            );
            const body = [
              marker,
              '### V5 automated real-browser QA',
              '**Result:** ' + (report.errors.length ? 'FAILED (' + report.errors.length + ' issues)' : 'PASSED'),
              '',
              ...rows,
              '',
              '#### Findings',
              ...(report.errors.length ? report.errors.map(e => '- ' + e) : ['- No browser QA violations reported.']),
              '',
              'Screenshots (1586/1440/1366/1920 desktop, 1024/768 tablet, 430/393/390/375/360 mobile) and JSON metrics are available in this workflow run’s **soft-tech-v5-desktop-visual-qa** artifact.',
              '',
              'Commit: ' + context.sha
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              });
            }
