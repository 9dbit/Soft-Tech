name: XDPLAY UNO Secure Onboarding Gate
on:
  pull_request:
    branches: [rebrand/xdplay-public-20261112]
    paths:
      - 'src/**'
      - 'next.config.mjs'
      - 'scripts/uno-secure-onboarding.test.mjs'
      - 'scripts/xdplay-public-qa.mjs'
      - 'scripts/verify-ui-lock.mjs'
      - '.github/workflows/uno-secure-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release-source integrity and demo admission assertions
        run: |
          node scripts/verify-ui-lock.mjs
          node --test scripts/uno-secure-onboarding.test.mjs
          node --test scripts/rebrand-xdplay.test.mjs
      - name: Install and build the exact Next.js candidate
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Prepare isolated browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify host quarantine, canonical UNO links and responsive marketing
        run: |
          npm run start -- -p 3000 > /tmp/xdplay-uno-onboard.log 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { cat /tmp/xdplay-uno-onboard.log; exit 1; }
          node scripts/xdplay-public-qa.mjs
          curl -fsS http://127.0.0.1:3000/api/games/uno-luck/status |
          node -e "let s=''; process.stdin.on('data',b=>s+=b).on('end',()=>{let v=JSON.parse(s);if(v.launch_enabled!==true||v.purchases_enabled!==false||v.redemption_enabled!==false||v.status!=='virtual_demo')process.exit(1)})"
      - name: Preserve browser screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdplay-uno-secure-onboarding-qa
          path: |
            qa-artifacts/xdplay/
            /tmp/xdplay-uno-onboard.log
          if-no-files-found: warn
          retention-days: 14
