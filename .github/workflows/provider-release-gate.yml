name: Provider signed evidence gate tests
on:
  workflow_dispatch:
  push:
    branches: [main, feat/provider-core-independent-20261109]
    paths:
      - 'provider-dashboard/scripts/release-evidence-gate.mjs'
      - 'provider-dashboard/test/release-evidence-gate.test.mjs'
      - 'qualification/evidence-gate.mjs'
      - 'qualification/test/evidence-gate.test.mjs'
      - '.github/workflows/provider-release-gate.yml'
  pull_request:
    paths:
      - 'provider-dashboard/scripts/release-evidence-gate.mjs'
      - 'provider-dashboard/test/release-evidence-gate.test.mjs'
      - 'qualification/evidence-gate.mjs'
      - 'qualification/test/evidence-gate.test.mjs'
      - '.github/workflows/provider-release-gate.yml'
permissions:
  contents: read
jobs:
  # Retain the existing fixture job ID for repository check compatibility.
  verify-gate-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate signatures, material integrity and legacy rejection with temporary fixtures
        run: node --test --test-concurrency=1 provider-dashboard/test/release-evidence-gate.test.mjs qualification/test/evidence-gate.test.mjs
      - name: State the scope of this workflow
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Verifier code tests only
          This workflow uses temporary synthetic identities and materials. A green
          result does not approve a release, attest to a real person, or activate production.

          The obsolete unsigned 14-gate RELEASE_EVIDENCE_JSON path is removed.
          Real review uses qualification/evidence-gate.mjs with the private signed
          bundle, separately managed trusted registry, expected production target,
          and exact material files. Keep operational evidence outside this public
          repository and workflow artifacts. Production remains locked.
          SUMMARY
