name: Game Studio V1 CI

on:
  push:
    branches:
      - "feat/universal-game-studio-v1-*"
    paths:
      - "game-studio/**"
      - ".github/workflows/game-studio-ci.yml"
  pull_request:
    paths:
      - "game-studio/**"
      - ".github/workflows/game-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-studio:
    name: Vite build and asset smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: game-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Studio source contract
        run: node scripts/smoke-check.mjs
      - name: Verify reusable slot layout and payout invariants
        run: npm run test:unit
      - name: Generate reproducible sandbox-only full-round math receipt
        run: npm run audit:smoke
      - name: Compare three independent research seed domains
        run: npm run audit:matrix
      - name: Build isolated Game Studio
        run: npm run build
      - name: Verify hosted Chrome browser for UI testing
        run: |
          command -v google-chrome || command -v google-chrome-stable
          google-chrome --version || google-chrome-stable --version
      - name: Test editor interactions and ZIP export
        run: npm run test:e2e
      - name: Upload UI screenshots and browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-studio-ui-qa
          path: |
            game-studio/test-results/
            game-studio/playwright-report/
          if-no-files-found: ignore
      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-studio-dist
          path: game-studio/dist/
          if-no-files-found: error
