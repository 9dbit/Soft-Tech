name: Provider production health monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-production-health.yml'
      - '.github/scripts/provider-health-monitor.py'
      - 'evidence/physical-isolation-resources-2026-11-10.json'
permissions:
  contents: read
concurrency:
  group: provider-production-health
  cancel-in-progress: false
jobs:
  provider-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all isolated stacks and remote backup restores
        timeout-minutes: 4
        run: python3 .github/scripts/provider-health-monitor.py
      - name: Upload health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: health-evidence/report.json
          if-no-files-found: error
          retention-days: 30
