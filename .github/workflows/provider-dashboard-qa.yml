name: Soft Tech Provider Dashboard Demo QA
on:
  push:
    branches:
      - feat/provider-panel-demo-20261109
    paths:
      - 'provider-dashboard/**'
      - '.github/workflows/provider-dashboard-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Node security, API and download smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: provider-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Authentication, RBAC, download and reconciliation tests
        run: npm test
      - name: Install Playwright browser test library
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Interactive browser and responsive screenshot QA
        run: node test/browser.mjs
      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-tech-provider-panel-browser-qa
          path: provider-dashboard/qa-artifacts/provider/
          if-no-files-found: warn
