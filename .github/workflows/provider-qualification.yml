name: Provider wallet and qualification safeguards
on:
  push:
    paths:
      - 'reference-wallet/**'
      - 'qualification/**'
      - 'provider-dashboard/lib/**'
      - 'provider-dashboard/server.mjs'
      - '.github/workflows/provider-qualification.yml'
  pull_request:
    paths:
      - 'reference-wallet/**'
      - 'qualification/**'
      - 'provider-dashboard/lib/**'
      - 'provider-dashboard/server.mjs'
      - '.github/workflows/provider-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check reference-wallet/server.mjs && node --check reference-wallet/wallet.mjs && node --check qualification/native-load.mjs && node --check qualification/evidence-gate.mjs
      - run: node --test --test-concurrency=1 reference-wallet/test/*.test.mjs qualification/test/*.test.mjs
