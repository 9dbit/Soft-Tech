name: XDPLAY provider UI qualification
on:
  push:
    branches: [rebrand/xdplay-provider-ui-20261112]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xdplay-provider-ui
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply display-only provider brand
        run: |
          node provider-dashboard/scripts/rebrand-xdplay-ui.mjs
          node --test provider-dashboard/test/xdplay-brand.test.mjs
      - name: Commit scoped branding
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git add provider-dashboard/public/index.html provider-dashboard/public/app.js provider-dashboard/public/staff.js provider-dashboard/public/logo.png provider-dashboard/lib/docs.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'brand: apply XDPLAY provider UI without altering authentication or wallet protocols'
            git push origin HEAD:rebrand/xdplay-provider-ui-20261112
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  acceptance:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify protected runtime and public source
        run: node --test provider-dashboard/test/xdplay-brand.test.mjs
      - name: Complete Core and authentication regressions
        working-directory: provider-dashboard
        run: |
          npm run check
          npm test
      - name: Install browser for isolated MFA acceptance
        working-directory: provider-dashboard
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Actual staff enrollment and independent approval UI
        working-directory: provider-dashboard
        run: node test/staff-browser.mjs
      - name: Preserve sanitized browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdplay-provider-ui-acceptance
          path: provider-dashboard/qa-artifacts/staff-auth/
          if-no-files-found: warn
          retention-days: 14
      - name: Record result on exact tested commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:'${{ needs.prepare.outputs.commit }}',state:'${{ job.status }}'==='success'?'success':'failure',context:'XDPLAY provider UI acceptance',description:'Display-only diff, full Core regression and actual MFA browser tests',target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
