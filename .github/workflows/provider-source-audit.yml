name: Provider engine source audit
on:
  push:
    branches: [feat/provider-core-independent-20261109]
    paths: ['.github/workflows/provider-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: repos/Soft-Tech
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 9dbit/uno-luck
          ref: a46fa7b36cc54c9cba60a9361432f0ebe076d746
          path: repos/uno-luck
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 9dbit/Mahjong-legend
          ref: d75ea42af04bbd027fecc64408f7cb52d1d4cfdf
          path: repos/Mahjong-legend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 9dbit/Skygate
          ref: 701e88fb281c08fced1b89e221cbbe21751e2ebc
          path: repos/Skygate
          persist-credentials: false
      - name: Bundle tracked source contracts and read-only engine health
        shell: bash
        run: |
          mkdir -p audit
          python3 - <<'PY'
          import pathlib, subprocess, zipfile, json, urllib.request
          root=pathlib.Path('repos');heads={}
          extensions={'.py','.js','.mjs','.cjs','.ts','.tsx','.jsx','.css','.html','.json','.md','.yml','.yaml','.toml','.txt','.sql','.sh','.svg','.woff2'}
          with zipfile.ZipFile('audit/provider-engine-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for repo in root.iterdir():
              heads[repo.name]=subprocess.check_output(['git','rev-parse','HEAD'],cwd=repo,text=True).strip()
              names=subprocess.check_output(['git','ls-files','-z'],cwd=repo).decode().split('\0')
              for name in names:
                p=repo/name
                if not name or not p.is_file() or p.is_symlink(): continue
                if pathlib.Path(name).name.startswith('.env'): continue
                if p.suffix in extensions or p.name in ('Dockerfile','Procfile') or (repo.name=='Soft-Tech' and name.startswith('provider-dashboard/public/')):
                  if p.stat().st_size < 8_000_000:z.write(p,repo.name+'/'+name)
            z.writestr('SOURCE_HEADS.json',json.dumps(heads,indent=2))
            health={}
            for key,url in {'uno':'https://uno-luck-web-staging.up.railway.app/health','mahjong':'https://mahjong-legend-web-production.up.railway.app/health','skygate':'https://skygate-web-production.up.railway.app/health'}.items():
              try:
                with urllib.request.urlopen(url,timeout=25) as r:health[key]={'url':url,'status':r.status,'body':r.read(50000).decode()}
              except Exception as e:health[key]={'url':url,'error':str(e)}
            z.writestr('HEALTH.json',json.dumps(health,indent=2))
          print(json.dumps(heads,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: provider-engine-source
          path: audit/provider-engine-source.zip
          retention-days: 3
