name: XDPLAY Mahjong launch acceptance
on:
  pull_request:
  push:
    branches: [rebrand/xdplay-public-20261112]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact XDPLAY dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Compile portal and routes
        run: npm run build
      - name: Verify first-party launch route and original catalog
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm run start > /tmp/xdplay-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/games/mahjong-wild; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/xdplay-start.log; exit 1; fi
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {gameEmbedUrl,gameLaunchUrl,validateRuntimeRegistry} from './config/runtime-policy.mjs';
          const registry=validateRuntimeRegistry(JSON.parse(readFileSync('config/game-runtimes.json','utf8')));
          const game=registry.runtimes.find(game=>game.id==='mahjong-wild');
          const source=gameLaunchUrl(game);
          const base='http://127.0.0.1:3000';
          const detail=await fetch(base+'/games/mahjong-wild');
          assert.equal(detail.status,200);
          const page=await detail.text();
          assert.match(page,/MAHJONG WILD/i);
          const launch=await fetch(base+'/play/mahjong-wild?next=https://attacker.example&playground_launch=do-not-forward', {redirect:'manual'});
          assert.equal(launch.status,307);
          assert.equal(launch.headers.get('location'),'https://xd-play.com/games/mahjong-wild/play');
          assert.match(launch.headers.get('cache-control')||'',/no-store/);
          assert.equal(launch.headers.get('referrer-policy'),'no-referrer');
          assert.doesNotMatch(launch.headers.get('location')||'',/attacker|do-not-forward/);
          const viewer=await fetch(base+'/games/mahjong-wild/play?next=https://attacker.example&token=do-not-forward');
          assert.equal(viewer.status,200);
          const html=await viewer.text();
          if(gameEmbedUrl(game)) assert.equal(/<iframe[^>]+src="([^"]+)"/.exec(html)?.[1],source);
          else {
            assert.doesNotMatch(html,/<iframe/);
            assert(html.includes(`href="${source}"`));
            assert.match(viewer.headers.get('content-security-policy')||'',/frame-src 'none'/);
          }
          assert.doesNotMatch(html.match(/<iframe[^>]+>/)?.[0]||'',/attacker|do-not-forward/);
          console.log('XDPLAY canonical Mahjong viewer, fixed alias and token refusal: PASS');
          EOF
